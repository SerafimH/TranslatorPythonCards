[package]
name = "fast_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "fast_core"
crate-type = ["cdylib"]

[dependencies]
# abi3-py39: один и тот же модуль работает с любым Python 3.9+
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
